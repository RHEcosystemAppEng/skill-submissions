name: hello-world
description: "Create a file with specific content -- minimal smoke-test submission"
persona: general
version: "0.1.3"
tags:
  - smoke-test
  - trivial
cpus: 1
memory_mb: 512
storage_mb: 1024
experiment:
  n_trials: 1

gate_policy:
  default_mode: warn
  combination: all_pass
  push_facts:
    endpoint: https://compass.stage.redhat.com/api/soundcheck/facts/
    entity_ref: component:default/hello-world-skill
    fact_ref_prefix: catalog:default/abevalflow_
  gates:
    harbor:
      mode: block
      push_fact: true
    cisco:
      mode: warn
      push_fact: true
