    inline: |
      please look for advisory name as fetchmailconf for id:RHSA-2002:294
  verify:
  - llmJudge:
      contains: |
        The following is the COMPLETE set of required core facts for CONTAINS. PASS if the agent answer covers them in substance (paraphrase OK). Extra correct detail is fine. FAIL if empty, clarifying-only, title/link dump with no substance, contradictory, or missing required core facts.

        ===== REQUIRED_CORE_FACTS =====
        The advisory ID RHSA-2002:294 is titled "Red Hat Security Advisory: fetchmail security update". It is not named "fetchmailconf". This Critical severity advisory, published on 2002-12-17, addresses CVE-2002-1365. It concerns a remotely-exploitable vulnerability in Fetchmail prior to version 6.2.0, which could lead to a crash or arbitrary code execution via a crafted email. Updated packages were available for Red Hat Linux Advanced Server and Advanced Workstation.
        ===== END REQUIRED_CORE_FACTS =====
