kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  name: errata-12
  description: Can you provide me details of affected product w.r.t to CVE-2026-25521
  labels:
    suite: security
    source: lightforge
    scenario: errata_end_to_end
    gt_id: '12'
    scoring: contains_must_have
    expected_tools: list_cve_affected_products
    argument_matchers: '{"cve_id":{"type":"exact","value":"CVE-2026-25521"}}'
    should_tool_error: 'false'
spec:
  prompt:
    inline: |
      Can you provide me details of affected product w.r.t to CVE-2026-25521
  verify:
  - llmJudge:
      contains: |
        PASS if the answer addresses the question in substance. Paraphrase is OK. Extra correct detail is OK. Missing dates, CVSS strings, exact package versions, and secondary advisories is OK. FAIL only if the answer is empty, refuses the question, contradicts the core fact, or is clearly about a different CVE or advisory. The notes below are the core fact, not a checklist.

        ===== REQUIRED_CORE_FACTS =====
        The answer gives affected-product status for CVE-2026-25521. Not-affected for the listed Red Hat products is enough. The CVSS score is not required.
        ===== END REQUIRED_CORE_FACTS =====
