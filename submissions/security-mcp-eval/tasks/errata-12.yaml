kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  name: errata-12
  description: Can you provide me details of affected product w.r.t to CVE-2026-25521
  labels:
    suite: security
    source: lightforge
    scenario: errata_end_to_end
    gt_id: '12'
    scoring: contains_must_have
    expected_tools: list_cve_affected_products
    argument_matchers: '{"cve_id":{"type":"exact","value":"CVE-2026-25521"}}'
    should_tool_error: 'false'
spec:
  prompt:
    inline: |
      Can you provide me details of affected product w.r.t to CVE-2026-25521
  verify:
  - llmJudge:
      contains: |
        The following is the COMPLETE set of required core facts for CONTAINS. PASS if the agent answer covers them in substance (paraphrase OK). Extra correct detail is fine. FAIL if empty, clarifying-only, title/link dump with no substance, contradictory, or missing required core facts.

        ===== REQUIRED_CORE_FACTS =====
        CVE-2026-25521 is rated Critical with a CVSSv3 score of 9.3. The vulnerability is a prototype pollution flaw in the Locutus npm library, affecting versions from 2.0.12 to before 2.0.39. The provided Red Hat products, including various components of the Logging Subsystem for Red Hat OpenShift (e.g., openshift-logging/elasticsearch6-rhel9, openshift-logging/kibana6-rhel8), are all listed as "Not affected" by this CVE.
        ===== END REQUIRED_CORE_FACTS =====
