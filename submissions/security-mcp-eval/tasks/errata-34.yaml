        ===== REQUIRED_CORE_FACTS =====
        Red Hat Security Advisory RHSA-2025:14135, titled "libarchive security update," was published on 2025-08-20. This update has a security impact rating of Important. It addresses a double free vulnerability (CVE-2025-5914) in libarchive at `archive_read_format_rar_seek_data()`. An update for libarchive is available for Red Hat Enterprise Linux 8. The advisory indicates that packages are available for download as part of this update.
