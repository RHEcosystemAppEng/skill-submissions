kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  name: errata-42
  description: How many CVEs does RHSA-2026:2769 address?
  labels:
    suite: security
    source: lightforge
    scenario: errata_end_to_end
    gt_id: '42'
    scoring: contains_must_have
    expected_tools: get_errata_by_id,search_advisories
    argument_matchers: '{"advisory_id":{"type":"exact","value":"RHSA-2026:2769"}}'
    should_tool_error: 'false'
spec:
  prompt:
    inline: |
      How many CVEs does RHSA-2026:2769 address?
  verify:
  - llmJudge:
      contains: |
        The following is the COMPLETE set of required core facts for CONTAINS. PASS if the agent answer covers them in substance (paraphrase OK). Extra correct detail is fine. FAIL if empty, clarifying-only, title/link dump with no substance, contradictory, or missing required core facts.

        ===== REQUIRED_CORE_FACTS =====
        RHSA-2026:2769 is returned by the erratum lookup. The erratum payload from this tool does not list
        the individual CVEs or a CVE count (Bugzilla IDs may appear instead).
        ===== END REQUIRED_CORE_FACTS =====
